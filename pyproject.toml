[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "leafparity"
version = "0.1.0"
description = "Exact equivalence checking for tree-ensemble models converted to ONNX: finds every input where the deployed model disagrees with the original, and proves the rest."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = ["numpy>=1.23", "onnx>=1.14", "onnxruntime>=1.15"]

[project.optional-dependencies]
xgboost = ["xgboost>=1.7"]
lightgbm = ["lightgbm>=4.0"]
sklearn = ["scikit-learn>=1.3", "joblib"]
all = ["xgboost>=1.7", "lightgbm>=4.0", "scikit-learn>=1.3", "joblib"]
dev = ["pytest", "skl2onnx", "onnxmltools", "xgboost", "lightgbm", "scikit-learn", "joblib", "pandas"]

[project.scripts]
leafparity = "leafparity.cli:entry"

[tool.setuptools]
packages = ["leafparity", "leafparity.loaders"]
